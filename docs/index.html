<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PlayScout — New Game Intelligence</title>
  <meta name="description" content="Track newly released Google Play games by date and category.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2307121f'/%3E%3Cpath d='M23 17l27 15-27 15z' fill='%2334d399'/%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root{--bg:#07111f;--panel:#0c1a2c;--line:#20334b;--muted:#93a4b8;--text:#edf5ff;--green:#35d399;--blue:#60a5fa;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#123157 0,transparent 30%),var(--bg);color:var(--text);font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1440px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--green),#14b8a6);display:grid;place-items:center;box-shadow:0 10px 30px #10b98133}.logo:after{content:'';border-left:16px solid #062017;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}.brand h1{font-size:1.25rem;margin:0}.brand p{margin:0;color:var(--muted);font-size:.85rem}.user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}.btn{border:1px solid var(--line);background:#102238;color:var(--text);border-radius:10px;padding:10px 15px;font-weight:700}.btn.primary{background:var(--green);border-color:var(--green);color:#042016}.btn:hover{filter:brightness(1.1)}.panel{background:#0c1a2de8;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 50px #0004}.filters{display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1.4fr auto;gap:12px;padding:18px}.field label{display:block;color:var(--muted);font-size:.78rem;font-weight:700;margin:0 0 6px;text-transform:uppercase;letter-spacing:.05em}.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#071522;color:var(--text);padding:0 12px;outline:none}.field input:focus,.field select:focus{border-color:var(--green)}.fetch{align-self:end;height:44px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:1.7rem;margin-top:4px}.bar{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);gap:15px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:970px}th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;padding:12px 18px;background:#091726}td{padding:14px 18px;border-top:1px solid #172a40;vertical-align:middle}.game{display:flex;align-items:center;gap:12px;min-width:250px}.game img{width:50px;height:50px;border-radius:12px;background:#14263b;object-fit:cover}.game strong{display:block}.game span{color:var(--muted);font-size:.82rem}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#17304a;color:#b8dcff;font-size:.78rem}.store{color:var(--green);text-decoration:none;font-weight:700}.empty{text-align:center;padding:60px 20px;color:var(--muted)}.pager{display:flex;justify-content:center;align-items:center;gap:12px;padding:16px;border-top:1px solid var(--line)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(430px,100%);padding:30px}.login-card h2{font-size:1.7rem;margin:18px 0 6px}.login-card p{color:var(--muted);margin:0 0 24px}.login-card input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;background:#071522;color:#fff;padding:0 14px;margin-bottom:12px}.message{min-height:24px;font-size:.9rem;color:var(--muted);margin-top:12px}.message.error{color:var(--danger)}.spinner{width:18px;height:18px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-4px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{padding:14px}.top{align-items:flex-start}.user span{display:none}.filters{grid-template-columns:1fr 1fr}.filters .search{grid-column:1/-1}.stats{gap:10px}.stat{padding:14px}.stat strong{font-size:1.35rem}.bar{align-items:flex-start;flex-direction:column}.fetch{width:100%}}
  </style>
</head>
<body>
<section id="loginView" class="login">
  <div class="panel login-card"><div class="logo"></div><h2>Sign in to PlayScout</h2><p>Approved email par secure six-digit code receive karein.</p>
    <form id="emailForm"><input id="email" type="email" placeholder="you@example.com" required autocomplete="email"><button class="btn primary" style="width:100%">Send verification code</button></form>
    <form id="otpForm" class="hidden"><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required><button class="btn primary" style="width:100%">Verify & open dashboard</button></form>
    <div id="loginMessage" class="message"></div>
  </div>
</section>
<main id="appView" class="shell hidden">
  <header class="top"><div class="brand"><div class="logo"></div><div><h1>PlayScout</h1><p>Google Play new-game intelligence</p></div></div><div class="user"><span id="userEmail"></span><button id="logout" class="btn">Sign out</button></div></header>
  <section class="panel filters">
    <div class="field"><label>From date</label><input id="from" type="date"></div><div class="field"><label>To date</label><input id="to" type="date"></div>
    <div class="field"><label>Category</label><select id="category"><option value="">All game categories</option></select></div>
    <div class="field"><label>Price</label><select id="price"><option value="">Free & paid</option><option value="free">Free</option><option value="paid">Paid</option></select></div>
    <div class="field search"><label>Search</label><input id="query" type="search" placeholder="Game or developer"></div><button id="fetch" class="btn primary fetch">Fetch games</button>
  </section>
  <section class="stats"><div class="panel stat"><small>Games found</small><strong id="found">0</strong></div><div class="panel stat"><small>Catalog size</small><strong id="catalog">0</strong></div><div class="panel stat"><small>Categories</small><strong id="categoryCount">0</strong></div><div class="panel stat"><small>Last scan</small><strong id="lastScan" style="font-size:1rem">—</strong></div></section>
  <section class="panel"><div class="bar"><div class="status"><i class="dot"></i><span id="scanStatus">Loading catalog…</span></div><button id="csv" class="btn">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Game</th><th>Developer</th><th>Category</th><th>Initial release</th><th>Price</th><th>Store</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty hidden">No verified games found for these filters.</div></div><div class="pager"><button id="prev" class="btn">Previous</button><span id="pageLabel">Page 1</span><button id="next" class="btn">Next</button></div></section>
</main>
<script>
const $=s=>document.querySelector(s), cfg=window.PLAYSCOUT_CONFIG||{};let client=null,all=[],filtered=[],page=1;const pageSize=50;
const safe=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function deviceId(){let id=localStorage.getItem('playscout_device');if(!id){id=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('playscout_device',id)}return id}
async function hashDevice(){const raw=deviceId()+'|'+navigator.userAgent+'|'+screen.width+'x'+screen.height;const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function msg(t,error=false){$('#loginMessage').textContent=t;$('#loginMessage').className='message'+(error?' error':'')}
async function authorize(session){const {data,error}=await client.rpc('claim_device',{p_device_hash:await hashDevice()});if(error||!data?.ok){await client.auth.signOut();const reason=data?.reason;throw new Error(reason==='different_device'?'Access is registered on another device. Admin se device reset karwayein.':reason==='email_not_allowed'?'This email is not approved.':'Access verification failed.')}$('#userEmail').textContent=session.user.email;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');await loadData()}
async function init(){if(!cfg.requireLogin){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');return loadData()}if(!cfg.supabaseUrl||cfg.supabaseUrl.includes('PASTE_'))return msg('Setup required: docs/config.js mein Supabase URL aur anon key paste karein.',true);client=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data}=await client.auth.getSession();if(data.session)try{await authorize(data.session)}catch(e){msg(e.message,true)}}
$('#emailForm').addEventListener('submit',async e=>{e.preventDefault();msg('Code sending…');const email=$('#email').value.trim().toLowerCase();const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)return msg(error.message,true);$('#emailForm').classList.add('hidden');$('#otpForm').classList.remove('hidden');msg('Email check karein aur 6-digit code enter karein.')});
$('#otpForm').addEventListener('submit',async e=>{e.preventDefault();msg('Verifying…');const {data,error}=await client.auth.verifyOtp({email:$('#email').value.trim().toLowerCase(),token:$('#otp').value.trim(),type:'email'});if(error)return msg(error.message,true);try{await authorize(data.session)}catch(x){msg(x.message,true)}});
$('#logout').onclick=async()=>{if(client)await client.auth.signOut();location.reload()};
async function loadData(){try{const r=await fetch('data/games.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Catalog unavailable');const d=await r.json();all=d.games||[];$('#catalog').textContent=all.length.toLocaleString();$('#lastScan').textContent=d.generatedAt?new Date(d.generatedAt).toLocaleString():'Not run';$('#scanStatus').textContent=`${d.scan?.status||'unknown'} • ${d.scan?.candidates||0} candidates • ${d.scan?.countries?.length||0} countries`;const cats=[...new Set(all.map(x=>x.category).filter(Boolean))].sort();$('#categoryCount').textContent=cats.length;$('#category').innerHTML='<option value="">All game categories</option>'+cats.map(x=>`<option>${safe(x)}</option>`).join('');const today=new Date().toISOString().slice(0,10);$('#from').value=$('#from').value||today;$('#to').value=$('#to').value||today;apply()}catch(e){$('#scanStatus').textContent=e.message;$('#empty').textContent='Scanner data is not available yet. Run GitHub Action first.';$('#empty').classList.remove('hidden')}}
function apply(){const f=$('#from').value,t=$('#to').value,c=$('#category').value,p=$('#price').value,q=$('#query').value.trim().toLowerCase();filtered=all.filter(x=>(!f||x.released>=f)&&(!t||x.released<=t)&&(!c||x.category===c)&&(!p||(p==='free'?x.free:!x.free))&&(!q||`${x.title} ${x.developer} ${x.appId}`.toLowerCase().includes(q)));page=1;render()}
function render(){const start=(page-1)*pageSize,list=filtered.slice(start,start+pageSize);$('#found').textContent=filtered.length.toLocaleString();$('#rows').innerHTML=list.map(x=>`<tr><td><div class="game"><img src="${safe(x.icon)}" alt="" loading="lazy"><div><strong>${safe(x.title)}</strong><span>${safe(x.appId)}</span></div></div></td><td>${safe(x.developer)}</td><td><span class="pill">${safe(x.category)}</span></td><td>${safe(x.released)}</td><td>${x.free?'Free':safe(x.price||'Paid')}</td><td><a class="store" href="${safe(x.url)}" target="_blank" rel="noopener">Open ↗</a></td></tr>`).join('');$('#empty').classList.toggle('hidden',filtered.length!==0);$('#pageLabel').textContent=`Page ${page} of ${Math.max(1,Math.ceil(filtered.length/pageSize))}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=Math.ceil(filtered.length/pageSize)}
$('#fetch').onclick=apply;$('#query').addEventListener('keydown',e=>{if(e.key==='Enter')apply()});$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};
$('#csv').onclick=()=>{const cols=['title','developer','category','released','free','price','appId','url'];const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=[cols.join(','),...filtered.map(x=>cols.map(k=>esc(x[k])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='playscout-games.csv';a.click();URL.revokeObjectURL(a.href)};init();
</script></body></html>
